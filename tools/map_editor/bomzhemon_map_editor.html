<style>

<script>
const $=id=>document.getElementById(id),TW=32,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TY={player_start:['🧍','Старт игрока','#5fb8b4'],barrel:['🛢️','Бочка','#d09a55'],dumpster:['🗑️','Бак','#8fbf6a'],item_spot:['✨','Предмет','#e8c34a'],trainer:['👁️','Тренер','#e8625a'],leader:['👑','Лидер','#c074e0'],pc:['🖥️','ПК','#6aa0e8'],npc:['💬','NPC / Меняла','#e88fb5'],trader:['💱','Меняла','#e88fb5']};
const OTYPES={environment:['🏠','Окружение','barrel','dumpster'],characters:['👤','Персонажи','trainer','leader','npc','trader'],special:['⭐','Специальные','player_start','item_spot','pc']};
const PHC=['#4f8a3c','#2f6b2a','#43474d','#8a8f96','#7a3f34','#2f6fa3','#a98b5a','#5a4a38'],PHN=['Трава','Высокая трава','Асфальт','Тротуар','Стена','Вода','Земля','Забор'];
const PHP={1:{encounter:true},4:{solid:true},5:{solid:true},7:{solid:true}};
const TOOLS={brush:['Кисть','B'],rect:['Прямоугольник','R'],fill:['Заливка','F'],erase:['Ластик','E'],pick:['Пипетка','I'],obj:['Объекты','V']};
const HINT={brush:'Рисуй выбранным тайлом',rect:'Тяни прямоугольник (Shift — стереть)',fill:'Клик — залить область',erase:'Стирает тайл (клетка станет пустой)',pick:'Клик по карте — взять тайл',obj:'Клик по пустому месте — поставить, по объекту — выбрать и двигать'};
let S,TS,U=[],R=[],tool='brush',sz=1,sel=1,otype='barrel',selO=null,ov=true,grid=true,cam={x:20,y:20,z:1},hover=null,drag=null,fh=null,fname='dump.tmj',space=false,dirty=false,asT,ITEMS={},TRAINERS={};
const cv=$('cv'),cx=cv.getContext('2d'),pal=$('pal');

/* ---------- tilesets ---------- */
function mkc(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function phTS(){const c=mkc(TW*8,TW),g=c.getContext('2d');let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
PHC.forEach((col,i)=>{g.fillStyle=col;g.fillRect(i*TW,0,TW,TW);for(let k=0;k<14;k++){g.fillStyle=rnd()>.5?'rgba(0,0,0,.14)':'rgba(255,255,255,.08)';g.fillRect(i*TW+rnd()*30,rnd()*30,2,2)}
g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=2;g.beginPath();
if(i==1)for(let k=4;k<32;k+=7){g.moveTo(i*TW+k,30);g.lineTo(i*TW+k+2,14)}
if(i==4){for(let y=8;y<32;y+=8){g.moveTo(i*TW,y);g.lineTo(i*TW+32,y)}g.moveTo(i*TW+16,0);g.lineTo(i*TW+16,8);g.moveTo(i*TW+8,16);g.lineTo(i*TW+8,24)}
if(i==5){g.moveTo(i*TW+4,10);g.quadraticCurveTo(i*TW+10,6,i*TW+16,10);g.moveTo(i*TW+14,22);g.quadraticCurveTo(i*TW+22,18,i*TW+28,22)}
if(i==7)for(let k=5;k<32;k+=9){g.moveTo(i*TW+k,2);g.lineTo(i*TW+k,30)}
if(i==2){g.setLineDash([6,6]);g.moveTo(i*TW,16);g.lineTo(i*TW+32,16)}
g.stroke();g.setLineDash([])});
return{img:c,cols:8,count:8,first:1,name:'bomzh_placeholder.png',path:'../assets/tiles/bomzh_placeholder.png',real:true}}
function ghost(cols,count,first,path){const rows=Math.ceil(count/cols),c=mkc(cols*TW,rows*TW),g=c.getContext('2d');g.font='11px Rubik,sans-serif';g.textAlign='center';
for(let i=0;i<count;i++){const x=i%cols*TW,y=(i/cols|0)*TW;g.fillStyle=`hsl(${i*37%360},30%,32%)`;g.fillRect(x,y,TW,TW);g.strokeStyle='rgba(0,0,0,.3)';g.strokeRect(x+.5,y+.5,TW-1,TW-1);g.fillStyle='#fff';g.fillText(i,x+16,y+20)}
return{img:c,cols,count,first,name:'tileset.png',path,real:false}}
const isPH=()=>TS.name.includes('placeholder');
const solid=g=>!!(g&&S.tp[g-TS.first]&&S.tp[g-TS.first].solid),enc=g=>!!(g&&S.tp[g-TS.first]&&S.tp[g-TS.first].encounter);

/* ---------- map model ---------- */
function newMap(w,h){TS=phTS();S={w,h,g:Array(w*h).fill(1),objs:[],nid:2,raw:null,tp:JSON.parse(JSON.stringify(PHP)),rt:{}};
S.objs.push({id:1,type:'player_start',name:'',x:w>>1,y:h>>1,ox:0,oy:0,props:{}});sel=0;selO=null;U=[];R=[];fname='dump.tmj';fh=null}
const gl=j=>j.layers.find(l=>l.type=='tilelayer'&&l.name=='ground')||j.layers.find(l=>l.type=='tilelayer');
const ogp=j=>j.layers.find(l=>l.type=='objectgroup'&&l.name=='objects')||j.layers.find(l=>l.type=='objectgroup');
const fromP=p=>Array.isArray(p)?Object.fromEntries(p.map(a=>[a.name,a.value])):(p||{});
const toP=o=>Object.entries(o).map(([name,value])=>({name,type:typeof value=='boolean'?'bool':typeof value=='number'?(Number.isInteger(value)?'int':'float'):'string',value}));
function rs(a,ow,oh,nw,nh,f){const n=Array(nw*nh).fill(f);for(let y=0;y<Math.min(oh,nh);y++)for(let x=0;x<Math.min(ow,nw);x++)n[y*nw+x]=a[y*ow+x];return n}
function fromJ(j){const g=gl(j);if(!g||!Array.isArray(g.data))throw 0;const o=ogp(j),ts=(j.tilesets||[])[0]||null;
const objs=((o&&o.objects)||[]).map(b=>{const tx=Math.floor(b.x/TW),dy=b.gid?TW:0,ty=Math.floor((b.y-dy)/TW);return{id:b.id,type:b.class||b.type||'',name:b.name||'',x:tx,y:ty,ox:b.x-tx*TW,oy:b.y-ty*TW-dy,props:fromP(b.properties),raw:b}});
const tp={},rt={};if(ts&&ts.tiles)ts.tiles.forEach(t=>{tp[t.id]=fromP(t.properties);rt[t.id]=t});
S={w:j.width,h:j.height,g:g.data.slice(),objs,nid:Math.max(j.nextobjectid||1,...objs.map(b=>b.id+1),1),raw:j,tp,rt};
if(!ts||(ts.image&&/placeholder/.test(ts.image)))TS=phTS();else TS=ghost(ts.columns||8,ts.tilecount||64,ts.firstgid||1,ts.image||'');
sel=0;selO=null}
function build(){const j=S.raw?JSON.parse(JSON.stringify(S.raw)):{compressionlevel:-1,infinite:false,orientation:'orthogonal',renderorder:'right-down',tiledversion:'1.10.2',tilewidth:TW,tileheight:TW,type:'map',version:'1.10',layers:[],tilesets:[],nextlayerid:3};
j.width=S.w;j.height=S.h;let g=gl(j);if(!g){g={id:1,name:'ground',type:'tilelayer',opacity:1,visible:true,x:0,y:0};j.layers.unshift(g)}
j.layers.forEach(l=>{if(l.type=='tilelayer'){if(l!==g&&Array.isArray(l.data))l.data=rs(l.data,l.width,l.height,S.w,S.h,0);l.width=S.w;l.height=S.h}});
g.data=S.g.slice();let o=ogp(j);if(!o){o={id:2,name:'objects',type:'objectgroup',draworder:'topdown',opacity:1,visible:true,x:0,y:0,objects:[]};j.layers.push(o)}
o.objects=S.objs.map(b=>{const r=b.raw||{};return{...r,id:b.id,name:b.name,type:b.type,class:b.type,x:b.x*TW+b.ox,y:b.y*TW+b.oy+(r.gid?TW:0),width:r.width!=null?r.width:TW,height:r.height!=null?r.height:TW,rotation:0,visible:true,properties:toP(b.props)}});
j.nextobjectid=S.nid;j.tilesets=j.tilesets||[];let ts=j.tilesets[0];
if(!ts){ts={firstgid:1,name:TS.name.replace(/\.png$/,''),tilewidth:TW,tileheight:TW,margin:0,spacing:0,image:TS.path,imagewidth:TS.img.width,imageheight:TS.img.height,columns:TS.cols,tilecount:TS.count};j.tilesets=[ts]}
if(!ts.source){if(TS.real){ts.imagewidth=TS.img.width;ts.imageheight=TS.img.height;ts.columns=TS.cols;ts.tilecount=TS.count}
const ids=[...new Set([...Object.keys(S.tp),...Object.keys(S.rt)])].map(Number).sort((a,b)=>a-b);
ts.tiles=ids.map(id=>({...(S.rt[id]||{}),id,properties:toP(S.tp[id]||{})})).filter(t=>t.properties.length||Object.keys(t).length>2);if(!ts.tiles.length)delete ts.tiles}
return j}

/* ---------- undo / autosave ---------- */
const snap=()=>JSON.stringify({w:S.w,h:S.h,g:S.g,o:S.objs,n:S.nid});
function push(){U.push(snap());if(U.length>80)U.shift();R.length=0}
function restore(s){const o=JSON.parse(s);S.w=o.w;S.h=o.h;S.g=o.g;S.objs=o.o;S.nid=o.n;selO=null;chg(1)}
function undo(){if(U.length){R.push(snap());restore(U.pop())}}
function redo(){if(R.length){U.push(snap());restore(R.pop())}}
function chg(skip){dirty=true;clearTimeout(asT);asT=setTimeout(()=>{try{localStorage.setItem('bomzh-map',JSON.stringify(build()))}catch(e){}},600);validate();upInsp();stat();redraw()}

/* ---------- file io ---------- */
function loadText(t,n){try{const j=JSON.parse(t);if(!j.layers)throw 0;fromJ(j);fname=n||fname;U=[];R=[];dirty=false;fit();upAll();toast('Открыто: '+fname)}catch(e){toast('Это не карта Tiled в JSON (.tmj). Проверь формат слоёв: CSV.',1)}}
async function openF(){if(window.showOpenFilePicker){try{[fh]=await showOpenFilePicker({types:[{description:'Карта Tiled',accept:{'application/json':['.tmj','.json']}}]});const f=await fh.getFile();loadText(await f.text(),f.name)}catch(e){}}else $('fi').click()}
async function save(as){const t=JSON.stringify(build());
if(window.showSaveFilePicker){try{if(!fh||as)fh=await showSaveFilePicker({suggestedName:fname,types:[{description:'Карта Tiled',accept:{'application/json':['.tmj']}}]});const w=await fh.createWritable();await w.write(t);await w.close();fname=fh.name;dirty=false;stat();return toast('Сохранено: '+fname)}catch(e){if(e.name=='AbortError')return}}
dl(new Blob([t],{type:'application/json'}),fname);dirty=false;toast('Скачано: '+fname+' — положи в maps/')}
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
function loadPng(f){const im=new Image();im.onload=()=>{const cols=Math.floor(im.width/TW),rows=Math.floor(im.height/TW),ex=S.raw&&S.raw.tilesets&&S.raw.tilesets[0]&&S.raw.tilesets[0].image;
if(isPH()&&!S.raw)S.tp={};TS={img:im,cols,count:cols*rows,first:TS.first,name:f.name,path:ex||'../assets/tiles/'+f.name,real:true};sel=0;upAll();toast('Тайлсет: '+f.name+' ('+cols*rows+' тайлов)')};im.src=URL.createObjectURL(f)}
function toast(m,e){const t=$('toast');t.textContent=m;t.className='s'+(e?' e':'');clearTimeout(t.k);t.k=setTimeout(()=>t.className='',2600)}

/* ---------- drawing ---------- */
let need=0;function redraw(){if(!need){need=1;requestAnimationFrame(draw)}}
function tdraw(g,id,x,y,a){if(id<0||id>=TS.count){g.fillStyle='#c0c';g.fillRect(x,y,TW,TW);return}g.drawImage(TS.img,id%TS.cols*TW,(id/TS.cols|0)*TW,TW,TW,x,y,TW,TW)}
function draw(){need=0;const d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(cv.width!=W*d||cv.height!=H*d){cv.width=W*d;cv.height=H*d}
cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#0f1114';cx.fillRect(0,0,cv.width,cv.height);cx.setTransform(d*cam.z,0,0,d*cam.z,d*cam.x,d*cam.y);cx.imageSmoothingEnabled=false;
cx.fillStyle='#1b1f24';cx.fillRect(0,0,S.w*TW,S.h*TW);
const x0=Math.max(0,Math.floor(-cam.x/cam.z/TW)),y0=Math.max(0,Math.floor(-cam.y/cam.z/TW)),x1=Math.min(S.w,Math.ceil((W-cam.x)/cam.z/TW)),y1=Math.min(S.h,Math.ceil((H-cam.y)/cam.z/TW));
for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const g=S.g[y*S.w+x];if(!g)continue;tdraw(cx,g-TS.first,x*TW,y*TW);
if(ov){if(solid(g)){cx.fillStyle='rgba(232,98,90,.32)';cx.fillRect(x*TW,y*TW,TW,TW);cx.strokeStyle='rgba(232,98,90,.7)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(x*TW+4,y*TW+TW-4);cx.lineTo(x*TW+TW-4,y*TW+4);cx.stroke()}
if(enc(g)){cx.fillStyle='rgba(120,230,90,.22)';cx.fillRect(x*TW,y*TW,TW,TW)}}}
if(grid&&cam.z>=.5){cx.strokeStyle='rgba(255,255,255,.1)';cx.lineWidth=1/cam.z;cx.beginPath();for(let x=x0;x<=x1;x++){cx.moveTo(x*TW,y0*TW);cx.lineTo(x*TW,y1*TW)}for(let y=y0;y<=y1;y++){cx.moveTo(x0*TW,y*TW);cx.lineTo(x1*TW,y*TW)}cx.stroke()}
cx.strokeStyle='#d09a55';cx.lineWidth=2/cam.z;cx.strokeRect(0,0,S.w*TW,S.h*TW);
cx.textAlign='center';cx.textBaseline='middle';
for(const o of S.objs){const t=TY[o.type]||['❓','','#aaa'],x=o.x*TW,y=o.y*TW;cx.fillStyle=t[2]+'55';cx.fillRect(x+2,y+2,TW-4,TW-4);cx.strokeStyle=t[2];cx.lineWidth=2;cx.strokeRect(x+2,y+2,TW-4,TW-4);cx.font='18px serif';cx.fillStyle='#fff';cx.fillText(t[0],x+16,y+17);
if(cam.z>=1){let label='';if(o.props.trainer_id&&TRAINERS[o.props.trainer_id])label=TRAINERS[o.props.trainer_id].name;else if(o.props.trainer_id)label=o.props.trainer_id;else if(o.props.item_id&&ITEMS[o.props.item_id])label=ITEMS[o.props.item_id].name;else if(o.props.item_id)label=o.props.item_id;else if(o.name)label=o.name;
if(label){cx.font='bold 9px Rubik,sans-serif';cx.fillStyle='rgba(0,0,0,.7)';cx.fillRect(x,y+TW-10,TW,10);cx.fillStyle='#fff';cx.fillText(label.slice(0,6),x+16,y+TW-5)}}
if(o===selO){cx.strokeStyle='#fff';cx.setLineDash([4,3]);cx.lineWidth=2;cx.strokeRect(x,y,TW,TW);cx.setLineDash([])}}
if(hover&&inb(hover)&&!drag){if(tool=='brush'||tool=='erase'){for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){const a=hover.x+i-(sz>>1),b=hover.y+j-(sz>>1);if(a<0||b<0||a>=S.w||b>=S.h)continue;cx.globalAlpha=.6;if(tool=='brush')tdraw(cx,sel,a*TW,b*TW);cx.globalAlpha=1;cx.strokeStyle='#5fb8b4';cx.lineWidth=2/cam.z;cx.strokeRect(a*TW,b*TW,TW,TW)}}
else{cx.strokeStyle='#5fb8b4';cx.lineWidth=2/cam.z;cx.strokeRect(hover.x*TW,hover.y*TW,TW,TW)}}
if(drag&&drag.k=='rect'){const r=rect(drag.a,drag.b);cx.fillStyle='rgba(95,184,180,.25)';cx.fillRect(r.x*TW,r.y*TW,r.w*TW,r.h*TW);cx.strokeStyle='#5fb8b4';cx.lineWidth=2/cam.z;cx.strokeRect(r.x*TW,r.y*TW,r.w*TW,r.h*TW)}}
const rect=(a,b)=>({x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(a.x-b.x)+1,h:Math.abs(a.y-b.y)+1});
function fit(){const W=cv.clientWidth,H=cv.clientHeight,z=Math.max(.25,Math.min(3,Math.min((W-40)/(S.w*TW),(H-40)/(S.h*TW))));cam={z,x:(W-S.w*TW*z)/2,y:(H-S.h*TW*z)/2};redraw()}

/* ---------- editing ---------- */
const inb=t=>t.x>=0&&t.y>=0&&t.x<S.w&&t.y<S.h,objAt=t=>S.objs.find(o=>o.x==t.x&&o.y==t.y);
const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}},tile=p=>({x:Math.floor((p.x-cam.x)/cam.z/TW),y:Math.floor((p.y-cam.y)/cam.z/TW)});
function paint(x,y,gid){for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){const a=x+i-(sz>>1),b=y+j-(sz>>1);if(a>=0&&b>=0&&a<S.w&&b<S.h)S.g[b*S.w+a]=gid}}
function line(x0,y0,x1,y1,f){const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){f(x0,y0);if(x0==x1&&y0==y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
const stroke=(a,b)=>line(a.x,a.y,b.x,b.y,(x,y)=>paint(x,y,tool=='erase'?0:sel+TS.first));
function flood(t){if(!inb(t))return;const from=S.g[t.y*S.w+t.x],to=sel+TS.first;if(from==to)return;const st=[t.x+t.y*S.w];while(st.length){const i=st.pop();if(S.g[i]!=from)continue;S.g[i]=to;const x=i%S.w,y=i/S.w|0;if(x>0)st.push(i-1);if(x<S.w-1)st.push(i+1);if(y>0)st.push(i-S.w);if(y<S.h-1)st.push(i+S.w)}}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const t=tile(pos(e));
if(e.button==1||e.button==2||space){drag={k:'pan',sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y};return}
if(e.button)return;
if(tool=='brush'||tool=='erase'){push();drag={k:'paint',last:t};stroke(t,t)}
else if(tool=='rect')drag={k:'rect',a:t,b:t,er:e.shiftKey};
else if(tool=='fill'){push();flood(t);chg()}
else if(tool=='pick'){if(inb(t)&&S.g[t.y*S.w+t.x]){sel=S.g[t.y*S.w+t.x]-TS.first;setTool('brush');upPal()}}
else{const o=objAt(t);if(o){selO=o;drag={k:'move',o,dx:t.x-o.x,dy:t.y-o.y};upInsp()}
else if(inb(t)){push();const props=/^(trainer|leader)$/.test(otype)?{trainer_id:defaultTrainerId||''}:otype=='item_spot'?{item_id:defaultItemId||''}:{};const n={id:S.nid++,type:otype,name:'',x:t.x,y:t.y,ox:0,oy:0,props};S.objs.push(n);selO=n;chg()}else{selO=null;upInsp()}}
redraw()};
cv.onpointermove=e=>{const p=pos(e),t=tile(p);hover=t;
if(drag){if(drag.k=='pan'){cam.x=drag.cx+e.clientX-drag.sx;cam.y=drag.cy+e.clientY-drag.sy}
else if(drag.k=='paint'){stroke(drag.last,t);drag.last=t}
else if(drag.k=='rect')drag.b=t;
else if(drag.k=='move'){const nx=Math.max(0,Math.min(S.w-1,t.x-drag.dx)),ny=Math.max(0,Math.min(S.h-1,t.y-drag.dy));if((nx!=drag.o.x||ny!=drag.o.y)){if(!drag.p){push();drag.p=1}drag.o.x=nx;drag.o.y=ny}}}
stat();redraw()};
cv.onpointerup=cv.onpointercancel=()=>{if(!drag)return;const d=drag;drag=null;
if(d.k=='rect'){push();const r=rect(d.a,d.b);for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)if(x>=0&&y>=0&&x<S.w&&y<S.h)S.g[y*S.w+x]=d.er?0:sel+TS.first}
if(d.k!='pan')chg();redraw()};
cv.onpointerleave=()=>{hover=null;redraw()};cv.oncontextmenu=e=>e.preventDefault();
cv.onwheel=e=>{e.preventDefault();const p=pos(e),z=Math.max(.2,Math.min(6,cam.z*(e.deltaY<0?1.15:1/1.15)));cam.x=p.x-(p.x-cam.x)*z/cam.z;cam.y=p.y-(p.y-cam.y)*z/cam.z;cam.z=z;stat();redraw()};
function setTool(t){tool=t;document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('item_sel_wrap').style.display=otype=='item_spot'?'block':'none';$('trainer_sel_wrap').style.display=/^(trainer|leader)$/.test(otype)?'block':'none';stat();redraw()}

/* ---------- map list ---------- */
const MAPS=['dump.tmj'];
async function loadMapList(){try{const r=await fetch('/maps/');if(!r.ok)throw new Error();
const html=await r.text();const parser=new DOMParser();const doc=parser.parseFromString(html,'text/html');

/* ---------- ui ---------- */
function syncSelectors(){for(const[cat,list]of Object.entries(OTYPES)){if(list.slice(2).includes(otype)){$('obj_cat').value=cat;const types=list.slice(2);
$('obj_grid').innerHTML=types.map(t=>`<button data-type="${t}" data-name="${TY[t][1]}"${t==otype?' class="on':''}>${TY[t][0]}</button>`).join('');
$('obj_grid').onclick=e=>{const b=e.target.closest('button');if(b){otype=b.dataset.type;setTool('obj')}};
return}}}
function upPal(){const ps=Math.min(1,236/(TS.cols*TW)),rows=Math.ceil(TS.count/TS.cols),w=TS.cols*TW*ps,h=rows*TW*ps;pal.width=w;pal.height=h;pal.style.width=w+'px';pal.style.height=h+'px';
const g=pal.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(TS.img,0,0,TS.cols*TW,rows*TW,0,0,w,h);const s=TW*ps;
for(let i=0;i<TS.count;i++){const x=i%TS.cols*s,y=(i/TS.cols|0)*s,p=S.tp[i]||{};if(p.solid){g.fillStyle='#e8625a';g.fillRect(x+2,y+2,5,5)}if(p.encounter){g.fillStyle='#78e65a';g.fillRect(x+s-7,y+2,5,5)}}
g.strokeStyle='#d09a55';g.lineWidth=2;g.strokeRect(sel%TS.cols*s+1,(sel/TS.cols|0)*s+1,s-2,s-2);
const p=S.tp[sel]||{};$('c_s').checked=!!p.solid;$('c_e').checked=!!p.encounter;$('tinfo').textContent='Тайл '+sel+(isPH()?' — '+PHN[sel]:'')+(TS.real?'':' (картинка не загружена — загрузи PNG тайлсета)')}
pal.onclick=e=>{const r=pal.getBoundingClientRect(),s=TW*Math.min(1,236/(TS.cols*TW)),i=Math.floor((e.clientX-r.left)/s)+Math.floor((e.clientY-r.top)/s)*TS.cols;if(i>=0&&i<TS.count){sel=i;if(tool!='brush'&&tool!='rect'&&tool!='fill')setTool('brush');upPal();redraw()}};
function tprop(k,v){const p=S.tp[sel]=S.tp[sel]||{};if(v)p[k]=true;else delete p[k];upPal();chg()}
$('c_s').onchange=e=>tprop('solid',e.target.checked);$('c_e').onchange=e=>tprop('encounter',e.target.checked);
function parseV(v){v=v.trim();return v=='true'?true:v=='false'?false:/^-?\d+(\.\d+)?$/.test(v)?+v:v}
function upInsp(){const o=selO,b=$('insp');if(!o||!S.objs.includes(o)){selO=null;b.innerHTML='<p class="dim">Выбери объект на карте или поставь новый.</p>';return}
const isItem=o.type=='item_spot';
const isTrainer=/^(trainer|leader)$/.test(o.type);
let itemSelect='',trainerSelect='',typeSelect='';
if(isItem){const opts=Object.entries(ITEMS).map(([id,it])=>`<option value="${id}"${o.props.item_id==id?' selected':''}>${it.name}</option>`).join('');
itemSelect=`<label>Предмет<select id="i_item"><option value="">— случайный —</option>${opts}</select></label>`;}
if(isTrainer){const opts=Object.entries(TRAINERS).map(([id,t])=>`<option value="${id}"${o.props.trainer_id==id?' selected':''}>${t.name}</option>`).join('');
trainerSelect=`<label>Тренер<select id="i_trainer"><option value="">— выбрать —</option>${opts}</select></label>`;}
const typeOpts=Object.entries(TY).map(([k,v])=>`<option value="${k}"${o.type==k?' selected':''}>${v[1]}</option>`).join('');
typeSelect=`<label>Тип<select id="i_t">${typeOpts}</select></label>`;
b.innerHTML=`${typeSelect}<label>Имя<input id="i_n" value="${esc(o.name)}"></label>${itemSelect}${trainerSelect}<div class="g2"><label>X<input id="i_x" type="number" value="${o.x}"></label><label>Y<input id="i_y" type="number" value="${o.y}"></label></div><label>Свойства (ключ=значение)<textarea id="i_p" rows="3">${esc(Object.entries(o.props).map(([k,v])=>k+'='+v).join('\n'))}</textarea></label><button id="i_d" class="bad" style="margin-top:6px">Удалить объект</button>`;
const ch=f=>e=>{push();f(e.target.value);chg()};
$('i_t').onchange=ch(v=>{o.type=v.trim();otype=v.trim();syncSelectors();setTool('obj')});$('i_n').onchange=ch(v=>o.name=v);$('i_x').onchange=ch(v=>o.x=Math.max(0,Math.min(S.w-1,+v|0)));$('i_y').onchange=ch(v=>o.y=Math.max(0,Math.min(S.h-1,+v|0)));
if(isItem){$('i_item').onchange=ch(v=>{if(v)o.props.item_id=v;else delete o.props.item_id});}
if(isTrainer){$('i_trainer').onchange=ch(v=>{if(v)o.props.trainer_id=v;else delete o.props.trainer_id});}
$('i_p').onchange=ch(v=>{o.props={};v.split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0)o.props[l.slice(0,i).trim()]=parseV(l.slice(i+1))})});
$('i_d').onclick=delO}
function delO(){if(!selO)return;push();S.objs=S.objs.filter(o=>o!==selO);selO=null;chg()}
function validate(){const r=[],c={},seen={};S.objs.forEach(o=>c[o.type]=(c[o.type]||0)+1);
if(!c.player_start)r.push('Нет объекта player_start');else if(c.player_start>1)r.push('player_start больше одного: '+c.player_start);
const emp=S.g.filter(g=>!g).length;if(emp)r.push('Пустых клеток земли: '+emp);
S.objs.forEach(o=>{const k=o.x+','+o.y,lab=(TY[o.type]?TY[o.type][1]:o.type||'без типа')+' ('+k+')';
if(o.x<0||o.y<0||o.x>=S.w||o.y>=S.h)r.push('Вне карты: '+lab);else if(/^(player_start|trainer|leader)$/.test(o.type)&&solid(S.g[o.y*S.w+o.x]))r.push('Стоит на solid-тайле: '+lab);
if(seen[k])r.push('Два объекта на клетке '+k);seen[k]=1;if(/^(trainer|leader)$/.test(o.type)&&!o.props.trainer_id)r.push('Нет trainer_id: '+lab);
if(/^(trainer|leader)$/.test(o.type)&&o.props.trainer_id&&!TRAINERS[o.props.trainer_id])r.push('Неверный trainer_id: '+lab);
if(o.type=='item_spot'&&o.props.item_id&&!ITEMS[o.props.item_id])r.push('Неверный item_id: '+lab)});
$('val').innerHTML=r.length?r.map(x=>'<li>'+esc(x)+'</li>').join(''):'<li class="ok">Всё в порядке</li>'}
function stat(){const t=hover&&inb(hover)?hover:null;$('s1').textContent=t?'x '+t.x+', y '+t.y+' · тайл '+(S.g[t.y*S.w+t.x]?S.g[t.y*S.w+t.x]-TS.first:'—'):'—';$('s2').textContent=S.w+'×'+S.h+' · объектов '+S.objs.length;$('s3').textContent=Math.round(cam.z*100)+'% · '+HINT[tool];$('s4').textContent=fname+(dirty?' •':'');$('mw').value=S.w;$('mh').value=S.h}

$('obj_cat').innerHTML=Object.entries(OTYPES).map(([k,v])=>`<option value="${k}">${v[0]} ${v[1]}</option>`).join('');
$('obj_cat').onchange=e=>{const cat=e.target.value;if(cat){const types=OTYPES[cat].slice(2);
$('obj_grid').innerHTML=types.map(t=>`<button data-type="${t}" data-name="${TY[t][1]}">${TY[t][0]}</button>`).join('');
$('obj_grid').onclick=e=>{const b=e.target.closest('button');if(b){otype=b.dataset.type;setTool('obj')}};
if(types.length>0)otype=types[0];setTool('obj')}else{$('obj_grid').innerHTML='';otype=''}};
$('item_sel_wrap').style.display='none';
$('trainer_sel_wrap').style.display='none';
$('b_load_items').onclick=()=>$('fi_items').click();
$('b_load_map').onclick=()=>$('fi').click();
$('obj_cat').value='environment';
$('obj_cat').dispatchEvent(new Event('change'));
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{sz=+b.dataset.z;document.querySelectorAll('[data-z]').forEach(x=>x.classList.toggle('on',x==b));redraw()});
$('bo').onclick=openF;$('bs').onclick=()=>save(0);$('bsa').onclick=()=>save(1);$('bu').onclick=undo;$('br').onclick=redo;$('bf').onclick=fit;

$('bnew').onclick=()=>{if(dirty&&!confirm('Несохранённые изменения пропадут. Создать новую карту?'))return;newMap(Math.max(4,+$('mw').value|0),Math.max(4,+$('mh').value|0));dirty=false;fit();upAll()};
onkeydown=e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.key!='Escape')return;const k=e.key.toLowerCase();
if(e.ctrlKey||e.metaKey){if(k=='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k=='y'){e.preventDefault();redo()}else if(k=='s'){e.preventDefault();save(e.shiftKey)}return}
if(e.key==' '){space=true;cv.style.cursor='grab';e.preventDefault();return}
const m={b:'brush',r:'rect',f:'fill',e:'erase',i:'pick',v:'obj'};if(m[k])setTool(m[k]);else if(k=='g')$('bg').click();else if(k=='o')$('bov').click();else if(e.key=='Delete'||e.key=='Backspace')delO();else if('123'.includes(k)&&k)document.querySelector(`[data-z="${k}"]`).click()};
onkeyup=e=>{if(e.key==' '){space=false;cv.style.cursor=''}};
onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
ondragover=e=>{e.preventDefault();$('drop').style.display='flex'};ondragleave=e=>{if(!e.relatedTarget)$('drop').style.display='none'};
ondrop=e=>{e.preventDefault();$('drop').style.display='none';const f=e.dataTransfer.files[0];if(!f)return;/\.png$/i.test(f.name)?loadPng(f):f.text().then(t=>loadText(t,f.name))};
new ResizeObserver(redraw).observe(cv);
let saved=null;try{saved=localStorage.getItem('bomzh-map')}catch(e){}
newMap(40,30);loadItems();loadTrainers();loadMapList();if(saved){try{fromJ(JSON.parse(saved));toast('Восстановлено автосохранение — тайлсет PNG загрузи заново')}catch(e){}}
setTool('brush');requestAnimationFrame(()=>{fit();upAll()});
</script></body></html>
